name: Update CPI

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas requests nbconvert ipykernel

      - name: Fetch CPI
        working-directory: inflation
        run: jupyter nbconvert --to notebook --execute fetch.ipynb --output /tmp/fetch.ipynb

      - name: Commit database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inflation/inflation.db
          git diff --cached --quiet || git commit -m "Update CPI database"
          git push
